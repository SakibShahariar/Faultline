version: 1

# AppImageBuilder recipe for Faultline.
# Build on Ubuntu 24.04 (glibc 2.39) to keep the host ABI baseline conservative.
# Run from the repository root with APP_VERSION set, for example:
#   APP_VERSION=<project-version> appimage-builder --recipe packaging/appimage/AppImageBuilder.yml

script:
  - |
    set -eu
    SOURCE_ROOT="$(cd "$SOURCE_DIR/../.." && pwd)"
    install -d "$TARGET_APPDIR/usr/share/faultline"
    cp -a "$SOURCE_ROOT/faultline" "$TARGET_APPDIR/usr/share/faultline/"
    install -D -m 0644 "$SOURCE_ROOT/demo/native/main.py" \
      "$TARGET_APPDIR/usr/share/faultline/demo/native/main.py"
    install -D -m 0644 "$SOURCE_ROOT/LICENSE" \
      "$TARGET_APPDIR/usr/share/licenses/faultline/LICENSE"
    install -D -m 0644 "$SOURCE_ROOT/README.md" \
      "$TARGET_APPDIR/usr/share/doc/faultline/README.md"
    install -D -m 0644 "$SOURCE_ROOT/data/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml" \
      "$TARGET_APPDIR/usr/share/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml"
    install -D -m 0644 "$SOURCE_ROOT/data/icons/hicolor/scalable/apps/io.github.sakibshahariar.Faultline.svg" \
      "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/apps/io.github.sakibshahariar.Faultline.svg"
    install -d "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/actions"
    install -m 0644 "$SOURCE_ROOT"/data/icons/hicolor/scalable/actions/faultline-*-symbolic.svg \
      "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/actions/"
    install -D -m 0644 "$SOURCE_ROOT/packaging/appimage/io.github.sakibshahariar.Faultline.desktop" \
      "$TARGET_APPDIR/usr/share/applications/io.github.sakibshahariar.Faultline.desktop"
    install -D -m 0644 "$SOURCE_ROOT/packaging/appimage/launch.py" \
      "$TARGET_APPDIR/usr/share/faultline/launch.py"
    install -D -m 0644 "$SOURCE_ROOT/tests/native_smoke.py" \
      "$TARGET_APPDIR/usr/share/faultline/tests/native_smoke.py"
    install -d "$TARGET_APPDIR/usr/bin"
    cc -O2 -Wall -Wextra -Werror \
      "$SOURCE_ROOT/packaging/appimage/launcher.c" \
      -o "$TARGET_APPDIR/usr/bin/faultline-app"
    install -d "$TARGET_APPDIR/usr/share/faultline/systemd/user"
    cp -a "$SOURCE_ROOT/data/systemd/user/." \
      "$TARGET_APPDIR/usr/share/faultline/systemd/user/"

AppDir:
  path: AppDir
  app_info:
    id: io.github.sakibshahariar.Faultline
    name: Faultline
    icon: io.github.sakibshahariar.Faultline
    version: "{{APP_VERSION}}"
    exec: usr/bin/faultline-app
    exec_args: $@
  apt:
    arch: [amd64]
    sources:
      - sourceline: "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble main universe"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble-updates main universe"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb [arch=amd64] http://security.ubuntu.com/ubuntu/ noble-security main universe"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
    include:
      - python3
      - python3-gi
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - adwaita-icon-theme
      - hicolor-icon-theme
      - gsettings-desktop-schemas
      - dconf-gsettings-backend
      - shared-mime-info
      # GTK dynamically loads these optional Wayland and graphics backends.
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libwayland-server0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libegl1
      - libgl1
      - libgbm1
      - libdrm2
      - libepoxy0
      # GTK's X11 backend also loads XCB extension libraries dynamically.
      - libxcb-render0
      - libxcb-shm0
      - libxcb-randr0
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-cursor0
      - libxcb-image0
      - libxcb-util1
      - libxcb-sync1
      - libxcb-present0
      - libxcb-dri3-0
      - libxcb-glx0
      - libx11-xcb1
      - libxrender1
      - libxrandr2
      - libxfixes3
      - libxcursor1
      - libxcomposite1
      - libxdamage1
      - libxinerama1
      - libxi6
      - libxext6
    exclude:
      - humanity-icon-theme
      - ubuntu-mono
  runtime:
    arch: [x86_64]
    version: continuous
    env:
      PYTHONHOME: "${APPDIR}/usr"
      PYTHONPATH: "${APPDIR}/usr/share/faultline"
      PYTHONNOUSERSITE: "1"
      GI_TYPELIB_PATH: "${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0"
      GSETTINGS_SCHEMA_DIR: "${APPDIR}/usr/share/glib-2.0/schemas"
  files:
    exclude:
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/man

AppImage:
  arch: x86_64
  file_name: "Faultline-{{APP_VERSION}}-x86_64.AppImage"
