name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Keep tagged release asset uploads serialized with the Fedora RPM workflow.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('faultline-release-{0}', github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  appimage:
    name: Build and smoke-test AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libfuse2 squashfs-tools fakeroot desktop-file-utils appstream strace

      - name: Resolve application version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download pinned AppImage builder
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimage-builder"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimage-builder" "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimage-builder --recipe packaging/appimage/AppImageBuilder.yml --skip-test
          appimage="Faultline-$APP_VERSION-x86_64.AppImage"
          test -s "$appimage"
          chmod +x "$appimage"
          sha256sum "$appimage" | tee "$appimage.sha256"

      - name: Validate desktop integration metadata
        run: |
          desktop-file-validate packaging/appimage/io.github.sakibshahariar.Faultline.desktop
          appstreamcli validate data/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml

      - name: Build clean offline smoke-test image
        run: |
          docker build --tag faultline-appimage-smoke - <<'DOCKERFILE'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates coreutils dbus-x11 xvfb xauth weston passwd \
              && useradd --create-home --uid 12345 smoke \
              && rm -rf /var/lib/apt/lists/*
          USER smoke
          DOCKERFILE

      - name: Test AppImage with its bundled GTK runtime on X11 and Wayland
        run: |
          appimage="$PWD/Faultline-$APP_VERSION-x86_64.AppImage"
          state="$RUNNER_TEMP/faultline-appimage-state"
          mkdir -p "$state"
          sudo chown 12345:12345 "$state"
          docker run --rm --network none \
            --volume "$appimage:/tmp/Faultline.AppImage:ro" \
            --volume "$state:/tmp/state" \
            faultline-appimage-smoke bash -euc '
              export APPIMAGE_EXTRACT_AND_RUN=1
              export XDG_DATA_HOME=/tmp/state/data
              export XDG_CONFIG_HOME=/tmp/state/config
              /tmp/Faultline.AppImage --cli boots
              test -s /tmp/state/data/faultline/crashes.db
              dbus-run-session -- xvfb-run -a \
                env GTK_A11Y=none GDK_BACKEND=x11 /tmp/Faultline.AppImage --smoke-test
              mkdir -p /tmp/state/runtime
              chmod 700 /tmp/state/runtime
              export XDG_RUNTIME_DIR=/tmp/state/runtime
              weston --backend=headless-backend.so --use-pixman \
                --socket=wayland-faultline --idle-time=0 --no-config \
                --log=/tmp/state/weston.log &
              weston_pid=$!
              trap "kill $weston_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 50); do
                test -S "$XDG_RUNTIME_DIR/wayland-faultline" && break
                sleep 0.1
              done
              test -S "$XDG_RUNTIME_DIR/wayland-faultline"
              dbus-run-session -- env GTK_A11Y=none GDK_BACKEND=wayland \
                WAYLAND_DISPLAY=wayland-faultline /tmp/Faultline.AppImage --smoke-test
            '

      - name: Measure repeated AppImage startup
        run: |
          appimage="$PWD/Faultline-$APP_VERSION-x86_64.AppImage"
          for run in first warm-1 warm-2; do
            echo "=== $run process startup ==="
            /usr/bin/time -f "wall-clock: %e seconds" \
              dbus-run-session -- xvfb-run -a \
                env GTK_A11Y=none GDK_BACKEND=x11 FAULTLINE_STARTUP_TRACE=1 \
                "$appimage" --smoke-test
          done

      - name: Benchmark mounted and extracted AppDir startup
        run: |
          mkdir -p diagnostics
          python3 packaging/appimage/diagnostics.py benchmark \
            --appimage "$PWD/Faultline-$APP_VERSION-x86_64.AppImage" \
            --output diagnostics/startup-benchmark.json --runs 3

      - name: Profile GTK and dynamic-library startup
        run: |
          python3 packaging/appimage/diagnostics.py profile \
            --appimage "$PWD/Faultline-$APP_VERSION-x86_64.AppImage" \
            --output diagnostics/profile

      - name: Inventory bundled dependencies and SquashFS settings
        run: |
          python3 packaging/appimage/diagnostics.py inventory \
            --appimage "$PWD/Faultline-$APP_VERSION-x86_64.AppImage" \
            --output diagnostics/inventory

      - name: Upload AppImage diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Faultline-${{ env.APP_VERSION }}-AppImage-Diagnostics
          path: diagnostics/
          if-no-files-found: error

      - name: Upload AppImage and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Faultline-${{ env.APP_VERSION }}-x86_64-AppImage
          path: |
            Faultline-${{ env.APP_VERSION }}-x86_64.AppImage
            Faultline-${{ env.APP_VERSION }}-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Attach AppImage to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Faultline-${{ env.APP_VERSION }}-x86_64.AppImage
            Faultline-${{ env.APP_VERSION }}-x86_64.AppImage.sha256
          body: |
            Faultline ${{ env.APP_VERSION }} x86_64 AppImage.

            The image bundles Python, PyGObject, GTK 4, and libadwaita. It targets
            Linux x86_64 with glibc 2.39 or newer. Host systemd diagnostic tools,
            GNOME session utilities, graphics drivers, and display server remain
            host-provided. See docs/packaging-appimage.md for runtime details.
