name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q faultline tests demo/native
      - name: Build wheel and verify installed assets
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = (
              "faultline/__init__.py",
              "faultline_diagnostics-0.1.0.data/data/share/faultline/demo/native/main.py",
              "faultline_diagnostics-0.1.0.data/data/share/applications/io.github.sakibshahariar.Faultline.desktop",
              "faultline_diagnostics-0.1.0.data/data/share/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml",
              "faultline_diagnostics-0.1.0.data/data/share/icons/hicolor/scalable/apps/io.github.sakibshahariar.Faultline.svg",
              "faultline_diagnostics-0.1.0.data/data/lib/systemd/user/faultline-collector.service",
          )
          missing = [path for path in required if path not in names]
          if missing:
              raise SystemExit("Wheel is missing installed assets: " + ", ".join(missing))
          print(f"Verified {len(required)} wheel contents in {wheel.name}")
          PY

  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and libadwaita runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 appstream desktop-file-utils libxml2-utils
      - name: Validate desktop integration assets
        run: |
          desktop-file-validate data/applications/io.github.sakibshahariar.Faultline.desktop
          appstreamcli validate data/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml
          xmllint --noout data/icons/hicolor/scalable/apps/io.github.sakibshahariar.Faultline.svg
          systemd-analyze verify data/systemd/user/faultline-collector.service data/systemd/user/faultline-collector.timer data/systemd/user/faultline-sampler.service
      - name: Launch native application under a virtual display
        run: GTK_A11Y=none dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/native_smoke.py

  rpm-build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora RPM build dependencies
        run: |
          dnf install -y nodejs git rpm-build redhat-rpm-config pyproject-rpm-macros \
            python3-devel python3-pip python3-setuptools python3-gobject \
            gtk4 libadwaita systemd-rpm-macros tar gzip
      - name: Create source archive from the checked-out commit
        run: |
          mkdir -p "$HOME/rpmbuild/SOURCES"
          tar --exclude=.git \
            --transform='s,^\./,Faultline-0.1.0/,' \
            -czf "$HOME/rpmbuild/SOURCES/v0.1.0.tar.gz" .
      - name: Build Fedora RPM
        run: rpmbuild -ba packaging/rpm/faultline.spec --define "_topdir $HOME/rpmbuild"
