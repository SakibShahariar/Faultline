name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Serialize tagged release asset uploads across the AppImage and RPM workflows.
# Ordinary branch CI remains independent.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('faultline-release-{0}', github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q faultline tests demo/native
      - name: Measure sampler collection overhead
        run: python tests/benchmark_sampler.py
      - name: Build wheel and verify installed assets
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          data_root = f"faultline_diagnostics-{version}.data/data/"
          required = (
              "faultline/__init__.py",
              data_root + "share/faultline/demo/native/main.py",
              data_root + "share/applications/io.github.sakibshahariar.Faultline.desktop",
              data_root + "share/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml",
              data_root + "share/icons/hicolor/scalable/apps/io.github.sakibshahariar.Faultline.svg",
              data_root + "lib/systemd/user/faultline-collector.service",
          )
          missing = [path for path in required if path not in names]
          if missing:
              raise SystemExit("Wheel is missing installed assets: " + ", ".join(missing))
          print(f"Verified {len(required)} wheel contents in {wheel.name}")
          PY

  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and libadwaita runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 appstream desktop-file-utils libxml2-utils
      - name: Validate desktop integration assets
        run: |
          desktop-file-validate data/applications/io.github.sakibshahariar.Faultline.desktop
          appstreamcli validate data/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml
          xmllint --noout data/icons/hicolor/scalable/apps/io.github.sakibshahariar.Faultline.svg
          systemd-analyze verify data/systemd/user/faultline-collector.service data/systemd/user/faultline-collector.timer data/systemd/user/faultline-sampler.service
      - name: Launch native application under a virtual display
        run: GTK_A11Y=none dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/native_smoke.py

  rpm-build:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora RPM build dependencies
        run: |
          dnf install -y nodejs git rpm-build redhat-rpm-config pyproject-rpm-macros \
            python3-devel python3-pip python3-setuptools python3-gobject \
            gtk4 libadwaita systemd-rpm-macros xorg-x11-server-Xvfb dbus-daemon tar gzip
      - name: Resolve and validate package version
        run: |
          set -eu
          project_version="$(awk -F'"' '/^version = / { print $2; exit }' pyproject.toml)"
          case "$GITHUB_REF" in
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              if [ "$version" != "$project_version" ]; then
                echo "Tag version $version does not match pyproject.toml version $project_version"
                exit 1
              fi
              ;;
            *)
              version="$project_version"
              ;;
          esac
          test -n "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Create source archive from the checked-out commit
        run: |
          mkdir -p "$HOME/rpmbuild/SOURCES"
          tar --exclude=.git --transform="s,^\\./,Faultline-$APP_VERSION/," \
            -czf "$HOME/rpmbuild/SOURCES/Faultline-$APP_VERSION.tar.gz" .
      - name: Build Fedora RPM
        run: rpmbuild -ba packaging/rpm/faultline.spec --define "_topdir $HOME/rpmbuild"
      - name: Install and verify packaged entry points and assets
        run: |
          rpm_file="$(find "$HOME/rpmbuild/RPMS/noarch" -name '*.rpm' -print -quit)"
          test -n "$rpm_file"
          dnf install -y "$rpm_file"
          faultline --help
          test -x /usr/bin/faultline
          test -x /usr/bin/faultline-gui
          test -f /usr/share/faultline/demo/native/main.py
          test -f /usr/share/applications/io.github.sakibshahariar.Faultline.desktop
          test -f /usr/share/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml
          test -f /usr/lib/systemd/user/faultline-collector.timer
          test -f /usr/lib/systemd/user/faultline-sampler.service
          set +e
          timeout 8s dbus-run-session -- xvfb-run -a env FAULTLINE_STARTUP_TRACE=1 faultline-gui
          gui_status=$?
          set -e
          if [ "$gui_status" -ne 124 ]; then
            echo "Installed GUI exited unexpectedly with status $gui_status"
            exit 1
          fi
          mkdir -p "$HOME/.local/share/faultline"
          printf 'keep-user-data\n' > "$HOME/.local/share/faultline/keep.txt"
          dnf remove -y faultline
          test -f "$HOME/.local/share/faultline/keep.txt"
          test ! -f /usr/lib/systemd/user/faultline-collector.timer
      - name: Stage RPM release asset and checksum
        run: |
          rpm_file="$(find "$HOME/rpmbuild/RPMS/noarch" -name '*.rpm' -print -quit)"
          test -n "$rpm_file"
          mkdir -p dist
          cp "$rpm_file" "dist/Faultline-$APP_VERSION-1.fc45.noarch.rpm"
          (cd dist && sha256sum "Faultline-$APP_VERSION-1.fc45.noarch.rpm" \
            > "Faultline-$APP_VERSION-1.fc45.noarch.rpm.sha256")
      - name: Upload Fedora RPM and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Faultline-${{ env.APP_VERSION }}-Fedora-45-RPM
          path: |
            dist/Faultline-${{ env.APP_VERSION }}-1.fc45.noarch.rpm
            dist/Faultline-${{ env.APP_VERSION }}-1.fc45.noarch.rpm.sha256
          if-no-files-found: error
      - name: Attach RPM to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Faultline-${{ env.APP_VERSION }}-1.fc45.noarch.rpm
            dist/Faultline-${{ env.APP_VERSION }}-1.fc45.noarch.rpm.sha256
