[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-diagnostics"
version = "0.1.3"
description = "Local-first Linux crash diagnosis and system forensics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
faultline = "faultline.cli:main"
faultline-gui = "faultline.gui:main"

[tool.setuptools]
packages = ["faultline"]

[tool.setuptools.data-files]
"share/faultline/demo/native" = ["demo/native/main.py"]
"share/applications" = ["data/applications/io.github.sakibshahariar.Faultline.desktop"]
"share/metainfo" = ["data/metainfo/io.github.sakibshahariar.Faultline.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["data/icons/hicolor/scalable/apps/io.github.sakibshahariar.Faultline.svg"]
"share/icons/hicolor/scalable/actions" = [
  "data/icons/hicolor/scalable/actions/faultline-overview-symbolic.svg",
  "data/icons/hicolor/scalable/actions/faultline-incidents-symbolic.svg",
  "data/icons/hicolor/scalable/actions/faultline-health-symbolic.svg",
  "data/icons/hicolor/scalable/actions/faultline-extensions-symbolic.svg",
  "data/icons/hicolor/scalable/actions/faultline-reports-symbolic.svg",
  "data/icons/hicolor/scalable/actions/faultline-preferences-symbolic.svg",
]
"lib/systemd/user" = [
  "data/systemd/user/faultline-collector.service",
  "data/systemd/user/faultline-collector.timer",
  "data/systemd/user/faultline-sampler.service",
]
