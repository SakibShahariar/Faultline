[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-diagnostics"
version = "0.1.0"
description = "Local-first Linux crash diagnosis and system forensics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools]
packages = ["faultline"]
